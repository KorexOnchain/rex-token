<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add ETH Testnet to MetaMask</title>
  <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .mm-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
    }

    .token-name {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .token-symbol {
      font-size: 14px;
      color: #666;
      margin-bottom: 2rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 12px;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn-metamask { background: #F6851B; }
    .btn-wc { background: #3B99FC; }

    .btn-icon { width: 22px; height: 22px; flex-shrink: 0; }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0.5rem 0 1rem;
      color: #444;
      font-size: 12px;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      border-top: 1px solid #2a2a2a;
    }

    .status {
      margin-top: 1rem;
      font-size: 13px;
      min-height: 20px;
      color: #666;
    }

    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 1.5rem 0;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .meta-label { color: #666; }
    .meta-value { color: #ccc; font-family: monospace; font-size: 12px; }
  </style>
</head>

    <p class="token-name">ETH Testnet</p>
    <p class="token-symbol">Add network to your wallet</p>

    <button class="btn btn-metamask" onclick="addMetaMask()">
      <svg class="btn-icon" viewBox="0 0 256 240" xmlns="http://www.w3.org/2000/svg">
        <polygon fill="#fff" points="250.066,0.002 140.218,81.566 160.645,33.027"/>
        <polygon fill="#fff" opacity="0.8" points="6.191,0.002 115.289,82.285 95.677,33.027"/>
      </svg>
      Add via MetaMask
    </button>

    <div class="divider-text">or</div>

    <button class="btn btn-wc" onclick="addWalletConnect()">

      </svg>
      Add via WalletConnect
    </button>

    <p class="status" id="status"></p>

    <hr class="divider">

    <div class="meta-row">
      <span class="meta-label">Network Name</span>
      <span class="meta-value" style="font-family: 'Segoe UI', sans-serif;">ETH Testnet</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Chain ID</span>
      <span class="meta-value">9991</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Currency</span>
      <span class="meta-value">ETH</span>
    </div>
  </div>

  <script>
    const NETWORK = {
      chainId: '0x2707',
      chainName: 'ETH Testnet',
      nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
      rpcUrls: ['https://virtual.mainnet.eu.rpc.tenderly.co/d68f8fc9-35e6-46c9-b43d-c8fe52ce1c84'],
      blockExplorerUrls: [],
    };

    const WC_PROJECT_ID = '80f8a3f7538625ec83a8ac64b60931eb';

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    async function addMetaMask() {
      if (typeof window.ethereum === 'undefined') {
        setStatus('MetaMask not detected. Please install it first.', 'error');
        return;
      }
      try {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [NETWORK],
        });
        setStatus('ETH Testnet successfully added to MetaMask!', 'success');
      } catch (err) {
        if (err.code === 4001) {
          setStatus('Network addition was cancelled.');
        } else {
          setStatus('Something went wrong. Please try again.', 'error');
        }
      }
    }

    async function addWalletConnect() {
      try {
        setStatus('Connecting wallet...');
        const provider = new WalletConnectProvider.default({
          projectId: WC_PROJECT_ID,
          rpc: {
            9991: 'https://virtual.mainnet.eu.rpc.tenderly.co/d68f8fc9-35e6-46c9-b43d-c8fe52ce1c84',
            1: 'https://cloudflare-eth.com',
          },
        });

        await provider.enable();

        await provider.request({
          method: 'wallet_addEthereumChain',
          params: [NETWORK],
        });

        setStatus('ETH Testnet successfully added to your wallet!', 'success');
      } catch (err) {
        if (err.message && err.message.includes('User closed')) {
          setStatus('Connection cancelled.');
        } else {
          setStatus('Something went wrong. Please try again.', 'error');
        }
      }
    }
  </script>
</body>
</html>
