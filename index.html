<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ethereum</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@walletconnect/modal@2.7.0/dist/index.umd.js"></script>
  <script src="https://unpkg.com/@walletconnect/sign-client@2.17.0/dist/index.umd.js"></script>
  <style>
    :root {
      --bg: #050508;
      --card: #0e0e14;
      --border: #1e1e2e;
      --accent: #7c6aff;
      --accent2: #ff6a6a;
      --mm: #F6851B;
      --wc: #3B99FC;
      --text: #f0f0f5;
      --muted: #55556a;
      --success: #4ade80;
      --error: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: var(--accent);
      top: -150px; left: -150px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: var(--accent2);
      bottom: -100px; right: -100px;
      animation-delay: -6s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #1a1a2e, #0e0e1a);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), transparent 60%);
      opacity: 0.3;
      z-index: -1;
    }

    .logo-wrap svg { width: 48px; height: 48px; }

    .network-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .network-sub {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.2px;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.2s;
    }

    .btn:hover::after { background: rgba(255,255,255,0.07); }
    .btn:active { transform: scale(0.98); }

    .btn-metamask {
      background: linear-gradient(135deg, #F6851B, #e07315);
      box-shadow: 0 4px 20px rgba(246,133,27,0.25);
    }

    .btn-metamask-mobile {
      background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-wc {
      background: linear-gradient(135deg, #3B99FC, #2a7fd4);
      box-shadow: 0 4px 20px rgba(59,153,252,0.25);
    }

    .btn-icon { width: 22px; height: 22px; flex-shrink: 0; }

    .status {
      margin-top: 1rem;
      font-size: 13px;
      min-height: 18px;
      color: var(--muted);
      text-align: center;
      font-family: 'DM Mono', monospace;
      transition: color 0.2s;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .meta-item {
      background: rgba(124,106,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .meta-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 13px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    .meta-item.full { grid-column: 1 / -1; }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
  </style>
</head>

          </svg>
        </div>
        <h1 class="network-name">Ethereum</h1>
        <p class="network-sub">chain id: 9991 · currency: ETH</p>
      </div>

      <p class="section-label">Add Network</p>

      <button class="btn btn-metamask" onclick="addMetaMask()">
        <svg class="btn-icon" viewBox="0 0 256 240" xmlns="http://www.w3.org/2000/svg">
          <polygon fill="#fff" points="250.066,0.002 140.218,81.566 160.645,33.027"/>
          <polygon fill="#fff" opacity="0.7" points="6.191,0.002 115.289,82.285 95.677,33.027"/>
        </svg>
        MetaMask — Browser Extension
      </button>

      <button class="btn btn-metamask-mobile" onclick="openMetaMaskMobile()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/>
          <line x1="12" y1="18" x2="12" y2="18.01"/>

        <div class="meta-item full">
          <p class="meta-label">RPC Endpoint</p>

    <p class="footer">Powered by Tenderly · Mainnet Fork</p>

  <script>
    const NETWORK = {
      chainId: '0x2707',
      chainName: 'Ethereum',
      nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
      rpcUrls: ['https://virtual.mainnet.eu.rpc.tenderly.co/d68f8fc9-35e6-46c9-b43d-c8fe52ce1c84'],
      blockExplorerUrls: null,
    };

    const WC_PROJECT_ID = '80f8a3f7538625ec83a8ac64b60931eb';

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    async function addMetaMask() {
  try {
    let provider = window.ethereum || window.web3?.currentProvider;
    
    if (!provider) {
      await new Promise(resolve => setTimeout(resolve, 1000));
      provider = window.ethereum || window.web3?.currentProvider;
    }

    if (!provider) {
      setStatus('MetaMask not detected. Please open this page inside the MetaMask browser.', 'error');
      return;
    }

    await provider.request({
      method: 'wallet_addEthereumChain',
      params: [NETWORK],
    });
    setStatus('Rex Testnet added to MetaMask!', 'success');
  } catch (err) {
    if (err.code === 4001) {
      setStatus('Cancelled.');
    } else {
      setStatus(err.message || 'Something went wrong.', 'error');
    }
  }
}
  function openMetaMaskMobile() {
  window.location.href = `https://metamask.app.link/dapp/${window.location.host}`;
}

    async function addWalletConnect() {
      try {
        setStatus('Opening WalletConnect...');

        const { WalletConnectModal } = window.WalletConnectModal || {};
        const { SignClient } = window.SignClient || {};

        if (!WalletConnectModal || !SignClient) {
          setStatus('WalletConnect is loading, please try again in a moment.', 'error');
          return;
        }

        const modal = new WalletConnectModal({ projectId: WC_PROJECT_ID });
        const client = await SignClient.init({ projectId: WC_PROJECT_ID });

        const { uri, approval } = await client.connect({
          requiredNamespaces: {
            eip155: {
              methods: ['wallet_addEthereumChain', 'eth_requestAccounts'],
              chains: ['eip155:1'],
              events: ['chainChanged', 'accountsChanged'],
            },
          },
        });

        if (uri) {
          modal.openModal({ uri });
          const session = await approval();
          modal.closeModal();

          const topic = session.topic;
          const accounts = Object.values(session.namespaces)
            .flatMap(ns => ns.accounts)
            .map(a => a.split(':')[2]);

          await client.request({
            topic,
            chainId: 'eip155:1',
            request: {
              method: 'wallet_addEthereumChain',
              params: [NETWORK],
            },
          });

          setStatus('Ethereum added to your wallet!', 'success');
        }
      } catch (err) {
        if (err.message && (err.message.includes('closed') || err.message.includes('cancelled'))) {
          setStatus('Cancelled.');
        } else {
          setStatus('Something went wrong. Please try again.', 'error');
        }
      }
    }
  </script>
